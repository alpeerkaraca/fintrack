[project]
name = "pii_masking_service"
version = "0.1.0"
description = "FinTrack PII & Financial Masking Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
    "spacy>=3.7.0",
    "transformers>=4.0.0",
    "torch>=2.0.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.25.0"
]

[tool.uv]
package = false
