spring:
  application:
    name: fintrack-server
    
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
    

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS}
    issuer: ${APP_JWT_ISSUER}
    audience: ${APP_JWT_AUDIENCE}
